<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Priority Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111827;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }
    body.no-scroll {
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 1rem;
      padding: 1.5rem 1.8rem 2rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
    }
    .subheading {
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: #4b5563;
    }

    /* Items row */
    .concepts-header {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .concepts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .concept {
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.85rem;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }
    /* Full-width pills in the top Items grid */
    #concepts .concept {
      width: 100%;
      box-sizing: border-box;
    }
    .concept.dragging {
      opacity: 0.7;
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.22);
      background: #e5f2ff;
    }
    .concept.assigned {
      background: #e5f0ff;
      border-color: #a5b4fc;
    }

    /* Buckets */
    .buckets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .bucket {
      background: #f9fafb;
      border-radius: 0.9rem;
      border: 1px solid #e5e7eb;
      min-height: 180px;
      padding: 0.75rem 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }
    .bucket-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3rem;
    }
    .bucket-title {
      font-weight: 600;
    }
    .bucket-high  .bucket-title { color: #b91c1c; }
    .bucket-medium .bucket-title { color: #b45309; }
    .bucket-low .bucket-title { color: #065f46; }

    .bucket-subtitle {
      font-size: 0.75rem;
      color: #6b7280;
    }
    .bucket-counter {
      font-size: 0.75rem;
      color: #4b5563;
    }
    .bucket-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding-top: 0.25rem;
    }
    .bucket.empty .bucket-items::before {
      content: "Drag items here…";
      font-size: 0.8rem;
      color: #9ca3af;
      font-style: italic;
    }
    .bucket.drop-target-valid {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #bfdbfe;
      transform: translateY(-1px);
    }
    .bucket.drop-target-full {
      border-color: #fecaca;
      box-shadow: 0 0 0 1px #fee2e2;
    }

    /* Email + submit */
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    .field {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .field label {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .field input[type="email"] {
      padding: 0.5rem 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field input[type="email"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #bfdbfe;
    }
    .error-text {
      font-size: 0.75rem;
      color: #b91c1c;
      min-height: 1em;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: #111827;
      color: #f9fafb;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      box-shadow: none;
    }
    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.16);
      background: #020617;
    }

    .status {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
    .status.success {
      color: #166534;
    }
    .status.error {
      color: #b91c1c;
    }

    /* Bottom sheet for mobile priority selection */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 40;
    }
    .sheet-backdrop.visible {
      display: flex;
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: #f9fafb;
      border-radius: 1rem 1rem 0 0;
      padding: 0.9rem 1.1rem 1.2rem;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.35);
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #e5e7eb;
      margin: 0 auto 0.75rem;
    }
    .sheet-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-align: center;
      color: #111827;
    }
    .sheet-options {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .sheet-option {
      border: none;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.25rem;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      color: #111827;
    }
    .sheet-option-label {
      flex: 1;
      color: #111827;
    }
    .sheet-option-check {
      font-size: 0.9rem;
      opacity: 0;
    }
    .sheet-option.selected .sheet-option-label {
      font-weight: 600;
    }
    .sheet-option.selected .sheet-option-check {
      opacity: 1;
    }
    .sheet-option.disabled {
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
    }
    @media (min-width: 768px) {
      /* Never show the sheet on desktop */
      .sheet-backdrop {
        display: none !important;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 0.75rem;
      }
      .container {
        padding: 1.1rem 1rem 1.35rem;
        border-radius: 0.75rem;
      }
      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Priority Survey</h1>
    <p class="subheading">
      Drag each item into one of the three categories: High, Medium, or Low priority.
      Each category must contain exactly <strong>5</strong> items.
    </p>

    <div class="concepts-header">Items:</div>
    <div id="concepts" class="concepts">
      <!-- Concepts generated by JS -->
    </div>

    <div class="buckets">
      <div class="bucket bucket-high empty" data-bucket-id="high">
        <div class="bucket-header">
          <div>
            <div class="bucket-title">High priority</div>
            <div class="bucket-subtitle">Most important / urgent</div>
          </div>
          <div class="bucket-counter" data-counter="high"></div>
        </div>
        <div class="bucket-items" data-bucket-items="high"></div>
      </div>

      <div class="bucket bucket-medium empty" data-bucket-id="medium">
        <div class="bucket-header">
          <div>
            <div class="bucket-title">Medium priority</div>
            <div class="bucket-subtitle">Important but not critical</div>
          </div>
          <div class="bucket-counter" data-counter="medium"></div>
        </div>
        <div class="bucket-items" data-bucket-items="medium"></div>
      </div>

      <div class="bucket bucket-low empty" data-bucket-id="low">
        <div class="bucket-header">
          <div>
            <div class="bucket-title">Low priority</div>
            <div class="bucket-subtitle">Can wait</div>
          </div>
          <div class="bucket-counter" data-counter="low"></div>
        </div>
        <div class="bucket-items" data-bucket-items="low"></div>
      </div>
    </div>

    <form id="surveyForm" novalidate>
      <div class="form-row">
        <div class="field">
          <label for="email">Your email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <div id="emailError" class="error-text"></div>
        </div>
        <div>
          <button id="submitButton" type="submit" disabled>
            Done
            <span aria-hidden="true">✅</span>
          </button>
        </div>
      </div>
      <div id="status" class="status"></div>
    </form>
  </div>

  <!-- Bottom sheet for mobile priority selection -->
  <div id="prioritySheetBackdrop" class="sheet-backdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Set priority</div>
      <div class="sheet-options">
        <button type="button" class="sheet-option" data-priority="high">
          <span class="sheet-option-label">High priority</span>
          <span class="sheet-option-check">✓</span>
        </button>
        <button type="button" class="sheet-option" data-priority="medium">
          <span class="sheet-option-label">Medium priority</span>
          <span class="sheet-option-check">✓</span>
        </button>
        <button type="button" class="sheet-option" data-priority="low">
          <span class="sheet-option-label">Low priority</span>
          <span class="sheet-option-check">✓</span>
        </button>
        <button type="button" class="sheet-option" data-priority="none">
          <span class="sheet-option-label">Priority not set</span>
          <span class="sheet-option-check">✓</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ---- Configuration: edit these 15 one-liners as you wish ----
    const concepts = [
      "Lightweight search form",
      "Image viewer initial load time",
      "General UX/UI cleanup",
      "Image viewer improvements v2",
      "Search form improvements v2",
      "Solidify analytics tracking",
      "Newspaper hints (PILF) v1",
      "Revamp My Projects",
      "P&P experiment: US package",
      "Conversion AB tests",
      "LIHP redesign",
      "LOHP redesign",
      "Coupon code on free trials",
      "Auto-apply coupon codes",
      "Deeper Storied integration"
    ].map((label, index) => ({
      id: "concept-" + (index + 1),
      label
    }));

    const MAX_PER_BUCKET = 5;
    const buckets = {
      high: [],
      medium: [],
      low: []
    };
    const conceptAssignments = {}; // conceptId -> bucketId | null

    const conceptsContainer = document.getElementById("concepts");
    const submitButton = document.getElementById("submitButton");
    const emailInput = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("surveyForm");

    // Mobile bottom sheet elements
    const prioritySheetBackdrop = document.getElementById("prioritySheetBackdrop");
    const sheetOptionButtons = prioritySheetBackdrop.querySelectorAll(".sheet-option");
    const isMobile = window.matchMedia("(max-width: 767px)").matches;
    let activeConceptId = null;

    // ---- Create concept chips ----
    function renderConcepts() {
      conceptsContainer.innerHTML = "";
      concepts.forEach((c) => {
        const el = document.createElement("div");
        el.className = "concept";
        el.draggable = true;
        el.textContent = c.label;
        el.dataset.conceptId = c.id;
        attachConceptDragEvents(el);
        attachConceptTapEvents(el);
        conceptsContainer.appendChild(el);
      });
    }

    function attachConceptDragEvents(el) {
      el.addEventListener("dragstart", (event) => {
        event.dataTransfer.setData("text/plain", el.dataset.conceptId);
        event.dataTransfer.effectAllowed = "move";
        el.classList.add("dragging");
      });
      el.addEventListener("dragend", () => {
        el.classList.remove("dragging");
      });
    }

    function attachConceptTapEvents(el) {
      if (!isMobile) return;
      el.addEventListener("click", () => {
        const conceptId = el.dataset.conceptId;
        if (!conceptId) return;
        openPrioritySheet(conceptId);
      });
    }

    // ---- Bucket logic ----
    function getBucketElements(bucketId) {
      return {
        wrapper: document.querySelector(`.bucket[data-bucket-id="${bucketId}"]`),
        itemsContainer: document.querySelector(`[data-bucket-items="${bucketId}"]`),
        counter: document.querySelector(`[data-counter="${bucketId}"]`)
      };
    }

    function updateBucketCounters() {
      ["high", "medium", "low"].forEach((bucketId) => {
        const { wrapper } = getBucketElements(bucketId);
        const counter = document.querySelector(`[data-counter="${bucketId}"]`);
        const count = buckets[bucketId].length;
        const remaining = MAX_PER_BUCKET - count;
        counter.textContent = `${count}/${MAX_PER_BUCKET} used · ${remaining} left`;
        wrapper.classList.toggle("empty", count === 0);
        wrapper.classList.toggle("drop-target-full", remaining === 0);
      });
    }

    function moveConceptToBucket(conceptId, targetBucketId) {
      // Remove from previous bucket, if any
      const prevBucketId = conceptAssignments[conceptId];
      if (prevBucketId) {
        buckets[prevBucketId] = buckets[prevBucketId].filter((id) => id !== conceptId);
      }

      // Add to new bucket
      if (targetBucketId) {
        buckets[targetBucketId].push(conceptId);
      }

      conceptAssignments[conceptId] = targetBucketId || null;
      updateBucketCounters();
      updateConceptVisuals();
      updateSubmitState();
    }

    function updateConceptVisuals() {
      // Mark assigned concepts
      document.querySelectorAll(".concept").forEach((el) => {
        const conceptId = el.dataset.conceptId;
        el.classList.toggle("assigned", Boolean(conceptAssignments[conceptId]));
      });

      // Rebuild bucket DOM contents
      ["high", "medium", "low"].forEach((bucketId) => {
        const { itemsContainer } = getBucketElements(bucketId);
        itemsContainer.innerHTML = "";
        buckets[bucketId].forEach((conceptId) => {
          const chip = document.querySelector(`.concept[data-concept-id="${conceptId}"]`);
          if (chip) {
            const cloned = chip.cloneNode(true);
            cloned.classList.add("assigned");
            cloned.draggable = true;
            cloned.dataset.conceptId = conceptId;
            attachConceptDragEvents(cloned);
            attachConceptTapEvents(cloned);
            itemsContainer.appendChild(cloned);
          }
        });
      });
    }

    function setupBucketDropAreas() {
      document.querySelectorAll(".bucket").forEach((bucketEl) => {
        const bucketId = bucketEl.dataset.bucketId;

        bucketEl.addEventListener("dragover", (event) => {
          event.preventDefault();
          const count = buckets[bucketId].length;
          if (count < MAX_PER_BUCKET) {
            bucketEl.classList.add("drop-target-valid");
            event.dataTransfer.dropEffect = "move";
          } else {
            event.dataTransfer.dropEffect = "none";
          }
        });

        bucketEl.addEventListener("dragleave", () => {
          bucketEl.classList.remove("drop-target-valid");
        });

        bucketEl.addEventListener("drop", (event) => {
          event.preventDefault();
          bucketEl.classList.remove("drop-target-valid");

          const conceptId = event.dataTransfer.getData("text/plain");
          if (!conceptId) return;

          const currentCount = buckets[bucketId].length;
          if (currentCount >= MAX_PER_BUCKET) {
            // bucket full – ignore drop
            return;
          }

          moveConceptToBucket(conceptId, bucketId);
        });
      });

      // Allow dragging back to top area (unassign)
      conceptsContainer.addEventListener("dragover", (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
      });

      conceptsContainer.addEventListener("drop", (event) => {
        event.preventDefault();
        const conceptId = event.dataTransfer.getData("text/plain");
        if (!conceptId) return;
        moveConceptToBucket(conceptId, null); // unassign
      });
    }

    // ---- Mobile bottom sheet logic ----
    function openPrioritySheet(conceptId) {
      if (!isMobile) return;
      activeConceptId = conceptId;
      const currentBucket = conceptAssignments[conceptId] || null;

      sheetOptionButtons.forEach((btn) => {
        const priority = btn.dataset.priority; // 'high','medium','low','none'
        btn.classList.remove("selected", "disabled");

        // selection state
        if (
          (priority === "none" && !currentBucket) ||
          priority === currentBucket
        ) {
          btn.classList.add("selected");
        }

        // disable full buckets (unless this item already belongs there)
        if (priority === "high" || priority === "medium" || priority === "low") {
          const bucketId = priority;
          const inBucketAlready = currentBucket === bucketId;
          const count = buckets[bucketId].length;
          const isFull = count >= MAX_PER_BUCKET;
          if (isFull && !inBucketAlready) {
            btn.classList.add("disabled");
          }
        }
      });

      prioritySheetBackdrop.classList.add("visible");
      document.body.classList.add("no-scroll");
    }

    function closePrioritySheet() {
      prioritySheetBackdrop.classList.remove("visible");
      document.body.classList.remove("no-scroll");
      activeConceptId = null;
    }

    sheetOptionButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!isMobile) return;
        if (!activeConceptId) return;
        if (btn.classList.contains("disabled")) return;

        const priority = btn.dataset.priority;
        const currentBucket = conceptAssignments[activeConceptId] || null;

        // If clicking the already selected option, just close
        if (
          (priority === "none" && !currentBucket) ||
          priority === currentBucket
        ) {
          closePrioritySheet();
          return;
        }

        if (priority === "none") {
          moveConceptToBucket(activeConceptId, null);
        } else {
          moveConceptToBucket(activeConceptId, priority);
        }

        closePrioritySheet();
      });
    });

    // Click outside sheet to dismiss without changes
    prioritySheetBackdrop.addEventListener("click", (event) => {
      if (event.target === prioritySheetBackdrop) {
        closePrioritySheet();
      }
    });

    // ---- Email + validation ----
    function isValidEmail(value) {
      if (!value) return false;
      const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return pattern.test(value.trim());
    }

    function updateSubmitState() {
      const allFull =
        buckets.high.length === MAX_PER_BUCKET &&
        buckets.medium.length === MAX_PER_BUCKET &&
        buckets.low.length === MAX_PER_BUCKET;

      const emailOk = isValidEmail(emailInput.value);
      const enabled = allFull && emailOk;

      submitButton.disabled = !enabled;

      if (!emailInput.value) {
        emailError.textContent = "";
      } else if (!emailOk) {
        emailError.textContent = "Please enter a valid email address.";
      } else {
        emailError.textContent = "";
      }
    }

    emailInput.addEventListener("input", () => {
      updateSubmitState();
    });

    // ---- Form submission ----
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "status";

      const email = emailInput.value.trim();
      if (!isValidEmail(email)) {
        emailError.textContent = "Please enter a valid email address.";
        updateSubmitState();
        return;
      }

      if (
        buckets.high.length !== MAX_PER_BUCKET ||
        buckets.medium.length !== MAX_PER_BUCKET ||
        buckets.low.length !== MAX_PER_BUCKET
      ) {
        statusEl.textContent =
          "Each category must contain exactly " + MAX_PER_BUCKET + " items.";
        statusEl.classList.add("error");
        return;
      }

      const idToLabel = Object.fromEntries(concepts.map((c) => [c.id, c.label]));
      const payload = {
        email,
        high: buckets.high.map((id) => idToLabel[id]),
        medium: buckets.medium.map((id) => idToLabel[id]),
        low: buckets.low.map((id) => idToLabel[id])
      };

      try {
        const response = await fetch("/api/save-survey", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("Invalid response from server");
        }

        statusEl.textContent = "Thank you! Your responses have been saved.";
        statusEl.classList.add("success");
        submitButton.disabled = true;
        submitButton.textContent = "Submitted";
      } catch (err) {
        console.error(err);
        statusEl.textContent =
          "There was an error saving your responses. Please try again later.";
        statusEl.classList.add("error");
      }
    });

    // ---- Init ----
    renderConcepts();
    setupBucketDropAreas();
    updateBucketCounters();
    updateSubmitState();
  </script>
</body>
</html>
