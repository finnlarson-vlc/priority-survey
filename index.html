<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Newspaper Archive Relaunch Priority Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111827;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 1rem;
      padding: 1.5rem 1.8rem 2rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
    }
    .subheading {
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: #4b5563;
    }

    /* Items row */
    .concepts-header {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .concepts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .concept {
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.85rem;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }
    /* Full-width pills in the top Items grid */
    #concepts .concept {
      width: 100%;
      box-sizing: border-box;
    }
    .concept.dragging {
      opacity: 0.7;
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.22);
      background: #e5f2ff;
    }
    .concept.assigned {
      background: #e5f0ff;
      border-color: #a5b4fc;
    }

    /* Buckets */
    .buckets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .bucket {
      background: #f9fafb;
      border-radius: 0.9rem;
      border: 1px solid #e5e7eb;
      min-height: 180px;
      padding: 0.75rem 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }
    .bucket-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3rem;
    }
    .bucket-title {
      font-weight: 600;
    }
    .bucket-high  .bucket-title { color: #b91c1c; }
    .bucket-medium .bucket-title { color: #b45309; }
    .bucket-low .bucket-title { color: #065f46; }

    .bucket-subtitle {
      font-size: 0.75rem;
      color: #6b7280;
    }
    .bucket-counter {
      font-size: 0.75rem;
      color: #4b5563;
    }
    .bucket-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding-top: 0.25rem;
    }
    .bucket.empty .bucket-items::before {
      content: "Drag items here…";
      font-size: 0.8rem;
      color: #9ca3af;
      font-style: italic;
    }
    .bucket.drop-target-valid {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #bfdbfe;
      transform: translateY(-1px);
    }
    .bucket.drop-target-full {
      border-color: #fecaca;
      box-shadow: 0 0 0 1px #fee2e2;
    }

    /* Email + submit */
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    .field {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .field label {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .field input[type="email"] {
      padding: 0.5rem 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field input[type="email"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #bfdbfe;
    }
    .error-text {
      font-size: 0.75rem;
      color: #b91c1c;
      min-height: 1em;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: #111827;
      color: #f9fafb;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      box-shadow: none;
    }
    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.16);
      background: #020617;
    }

    .status {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      min-height: 1.2em;
