<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2026 NA Relaunch Priorities</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111827;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }
    body.no-scroll {
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 1rem;
      padding: 1.5rem 1.8rem 2rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
    }
    .subheading {
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: #4b5563;
    }

    /* Items row */
    .concepts-header {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .concepts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .concepts.all-assigned {
      /* still a drop target; message sits inside */
    }
    .concepts-empty-message {
      font-size: 0.9rem;
      color: #6b7280;
      font-style: italic;
      padding: 0.4rem 0.2rem;
    }
    .concept {
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.85rem;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.15s ease, transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
